<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Image Cropper</title>
<style>
  :root {
    --bg-color: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.7);
    --border-color: rgba(255, 255, 255, 0.1);
    --primary-color: #38bdf8;
    --primary-hover: #0284c7;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }

  .container {
    width: 100%;
    max-width: 900px;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
  }

  h1 {
    margin-top: 0;
    font-size: 1.8rem;
    font-weight: 700;
    text-align: center;
    background: linear-gradient(to right, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p.description {
    text-align: center;
    color: var(--text-muted);
    margin-bottom: 25px;
    font-size: 0.95rem;
  }

  .drop-zone {
    border: 2px dashed rgba(56, 189, 248, 0.4);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    background: rgba(15, 23, 42, 0.4);
  }

  .drop-zone:hover {
    border-color: var(--primary-color);
    background: rgba(56, 189, 248, 0.05);
  }

  .drop-zone p {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 500;
  }

  .drop-zone span {
    font-size: 0.85rem;
    color: var(--text-muted);
    display: block;
    margin-top: 6px;
  }

  input[type="file"] {
    display: none;
  }

  .controls {
    margin-top: 25px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .control-group label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--primary-color);
  }

  .btn-group {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 12px;
    margin-top: 25px;
  }

  button {
    background-color: var(--primary-color);
    color: #0f172a;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  button:hover:not(:disabled) {
    background-color: var(--primary-hover);
    color: #ffffff;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-secondary {
    background-color: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-main);
  }

  .btn-secondary:hover:not(:disabled) {
    background-color: rgba(255, 255, 255, 0.1);
    color: var(--text-main);
  }

  .results-grid {
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 15px;
    max-height: 400px;
    overflow-y: auto;
    padding-right: 5px;
  }

  .result-card {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .result-card img {
    width: 100%;
    height: 180px;
    object-fit: contain;
    background: #020617;
  }

  .result-card-body {
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .download-btn {
    padding: 4px 8px;
    font-size: 0.75rem;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Bulk Screenshot Auto-Cropper</h1>
  <p class="description">Trims white, black, and gradient background margins from full screenshots automatically.</p>

  <div class="drop-zone" id="dropZone">
    <p>Drop your screenshots here or click to browse</p>
    <span>Supports PNG, JPG, WEBP (Bulk processing supported)</span>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Crop Sensitivity (Threshold) <span id="thresholdVal">30</span></label>
      <input type="range" id="threshold" min="5" max="100" value="30">
    </div>
  </div>

  <div class="btn-group">
    <button id="processBtn">Process All Screenshots</button>
    <button id="downloadAllBtn" class="btn-secondary" disabled>Download All</button>
  </div>

  <div class="results-grid" id="resultsGrid"></div>
</div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const processBtn = document.getElementById('processBtn');
  const downloadAllBtn = document.getElementById('downloadAllBtn');
  const resultsGrid = document.getElementById('resultsGrid');
  const thresholdInput = document.getElementById('threshold');
  const thresholdVal = document.getElementById('thresholdVal');

  let loadedFiles = [];
  let processedImages = [];

  thresholdInput.addEventListener('input', (e) => {
    thresholdVal.textContent = e.target.value;
  });

  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.style.borderColor = 'var(--primary-color)';
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.style.borderColor = 'rgba(56, 189, 248, 0.4)';
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.style.borderColor = 'rgba(56, 189, 248, 0.4)';
    if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleFiles(e.target.files);
  });

  function handleFiles(files) {
    loadedFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
    dropZone.querySelector('p').textContent = `${loadedFiles.length} file(s) selected`;
  }

  function colorDiff(r1, g1, b1, r2, g2, b2) {
    return Math.abs(r1 - r2) + Math.abs(g1 - g2) + Math.abs(b1 - b2);
  }

  function autoCropImage(img, threshold) {
    const canvas = document.createElement('canvas');
    const w = img.naturalWidth;
    const h = img.naturalHeight;
    canvas.width = w;
    canvas.height = h;

    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    // Use top-left corner pixel as background reference color
    const bgR = data[0];
    const bgG = data[1];
    const bgB = data[2];

    let minX = w, minY = h, maxX = 0, maxY = 0;

    // Scan every 2nd pixel for speed
    for (let y = 0; y < h; y += 2) {
      for (let x = 0; x < w; x += 2) {
        const idx = (y * w + x) * 4;
        const r = data[idx];
        const g = data[idx + 1];
        const b = data[idx + 2];

        if (colorDiff(bgR, bgG, bgB, r, g, b) > threshold) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    // Fallback if image is solid
    if (maxX <= minX || maxY <= minY) {
      minX = 0; minY = 0; maxX = w - 1; maxY = h - 1;
    }

    const cropW = maxX - minX + 1;
    const cropH = maxY - minY + 1;

    const croppedCanvas = document.createElement('canvas');
    croppedCanvas.width = cropW;
    croppedCanvas.height = cropH;
    const croppedCtx = croppedCanvas.getContext('2d');

    croppedCtx.drawImage(img, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

    return croppedCanvas.toDataURL('image/png');
  }

  processBtn.addEventListener('click', async () => {
    if (!loadedFiles.length) return alert('Please select images first.');

    processBtn.disabled = true;
    processBtn.textContent = 'Processing...';
    resultsGrid.innerHTML = '';
    processedImages = [];

    const threshold = Number(thresholdInput.value);

    for (let i = 0; i < loadedFiles.length; i++) {
      const file = loadedFiles[i];
      const img = new Image();
      img.src = URL.createObjectURL(file);
      await img.decode();

      const croppedDataUrl = autoCropImage(img, threshold);
      const outputName = `clean_${file.name.replace(/\.[^/.]+$/, "")}.png`;

      processedImages.push({ url: croppedDataUrl, name: outputName });

      const card = document.createElement('div');
      card.className = 'result-card';

      const preview = document.createElement('img');
      preview.src = croppedDataUrl;

      const body = document.createElement('div');
      body.className = 'result-card-body';
      body.innerHTML = `<span>Cleaned ${i + 1}</span>`;

      const dlBtn = document.createElement('button');
      dlBtn.className = 'download-btn';
      dlBtn.textContent = 'Save';
      dlBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = croppedDataUrl;
        a.download = outputName;
        a.click();
      };

      body.appendChild(dlBtn);
      card.appendChild(preview);
      card.appendChild(body);
      resultsGrid.appendChild(card);

      URL.revokeObjectURL(img.src);
    }

    processBtn.disabled = false;
    processBtn.textContent = 'Process All Screenshots';
    downloadAllBtn.disabled = false;
  });

  downloadAllBtn.addEventListener('click', () => {
    processedImages.forEach((item, index) => {
      setTimeout(() => {
        const a = document.createElement('a');
        a.href = item.url;
        a.download = item.name;
        a.click();
      }, index * 200);
    });
  });
</script>
</body>
</html>
