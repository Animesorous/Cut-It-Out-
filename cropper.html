<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArtExtract — Panel & Gradient Isolator</title>
<style>
:root{
  --bg:#070a14;
  --panel:#0d1322;
  --line:rgba(120,220,255,.18);
  --text:#edf8ff;
  --muted:#8290a8;
  --cyan:#4de8ff;
  --blue:#5d7cff;
  --shadow:0 25px 80px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);padding:30px 15px;
}
main{max-width:1100px;margin:auto}
h1{margin:0 0 8px;font-size:32px;letter-spacing:-1px}
h1 span{color:var(--cyan)}
p.sub{margin:0 0 24px;color:var(--muted);font-size:14px}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:20px;box-shadow:var(--shadow);
}
.drop-zone{
  border:2px dashed var(--line);border-radius:14px;padding:40px 20px;
  text-align:center;cursor:pointer;transition:.2s;background:rgba(255,255,255,.015);
}
.drop-zone:hover{border-color:var(--cyan);background:rgba(77,232,255,.03)}
input[type=file]{display:none}
.controls{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:20px;
}
.control-group{display:flex;flex-direction:column;gap:6px}
label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase}
input[type=range]{width:100%}
.btn-group{
  display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:20px;
}
.btn{
  background:linear-gradient(135deg,var(--cyan),var(--blue));border:none;
  color:#04101a;font-weight:800;padding:12px 20px;border-radius:10px;
  cursor:pointer;transition:.2s;width:100%;font-size:15px;
}
.btn:hover:not(:disabled){opacity:.9;transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{
  background:transparent;border:1px solid var(--line);color:var(--text);
}
.btn-secondary:hover:not(:disabled){background:rgba(255,255,255,.05)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px;margin-top:25px}
.result-item{
  background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;display:flex;flex-direction:column;
}
.result-item img{width:100%;height:200px;object-fit:contain;background:#03050a}
.result-info{padding:10px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.dl-btn{
  background:rgba(77,232,255,.15);border:1px solid var(--cyan);color:var(--cyan);
  padding:4px 8px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;
}
</style>
</head>
<body>

<main>
  <h1>ArtExtract <span>// Manga Panel Crop</span></h1>
  <p class="sub">Trims white, black, and gradient background margins from full screenshots automatically.</p>

  <div class="card">
    <div class="drop-zone" id="dropZone">
      <div style="font-size:24px;margin-bottom:8px">✂️</div>
      <strong>Drop manhwa or manga screenshots here</strong>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Bulk processing enabled — select multiple screenshots</div>
      <input type="file" id="fileInput" accept="image/*" multiple>
    </div>

    <div class="controls">
      <div class="control-group">
        <label>Crop Sensitivity: <span id="tolVal">28</span></label>
        <input type="range" id="tolerance" min="5" max="80" value="28">
      </div>
    </div>

    <div class="btn-group">
      <button class="btn" id="processBtn">Extract Panel Artwork</button>
      <button class="btn btn-secondary" id="downloadAllBtn" disabled>Save All</button>
    </div>
  </div>

  <div class="results" id="resultsGrid"></div>
</main>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const processBtn = document.getElementById('processBtn');
const downloadAllBtn = document.getElementById('downloadAllBtn');
const resultsGrid = document.getElementById('resultsGrid');
const toleranceInput = document.getElementById('tolerance');
const tolVal = document.getElementById('tolVal');

let loadedFiles = [];
let processedOutputs = [];

toleranceInput.addEventListener('input', e => tolVal.textContent = e.target.value);

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = 'var(--cyan)'; });
dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = 'var(--line)');
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.style.borderColor = 'var(--line)';
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => { if (e.target.files.length) handleFiles(e.target.files); });

function handleFiles(files) {
  loadedFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
  dropZone.querySelector('strong').textContent = `${loadedFiles.length} file(s) ready to trim`;
}

function colorDiff(r1, g1, b1, r2, g2, b2) {
  return Math.abs(r1 - r2) + Math.abs(g1 - g2) + Math.abs(b1 - b2);
}

// Improved global margin cropping algorithm (keeps entire screenshot as 1 clean image)
function processImage(img, tol) {
  const canvas = document.createElement('canvas');
  const w = img.naturalWidth;
  const h = img.naturalHeight;
  canvas.width = w;
  canvas.height = h;

  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);

  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;

  // Sample corner pixels to detect outer border color (handles white, black, or custom gradients)
  const bgR = data[0];
  const bgG = data[1];
  const bgB = data[2];

  let minX = w, minY = h, maxX = 0, maxY = 0;

  // Scan four corners inwards to isolate true content boundaries
  for (let y = 0; y < h; y += 2) {
    for (let x = 0; x < w; x += 2) {
      const idx = (y * w + x) * 4;
      const r = data[idx];
      const g = data[idx + 1];
      const b = data[idx + 2];

      if (colorDiff(bgR, bgG, bgB, r, g, b) > tol) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }

  // Fallback protection if no background margins exist
  if (maxX <= minX || maxY <= minY) {
    minX = 0; minY = 0; maxX = w - 1; maxY = h - 1;
  }

  const cropW = maxX - minX + 1;
  const cropH = maxY - minY + 1;

  const croppedCanvas = document.createElement('canvas');
  croppedCanvas.width = cropW;
  croppedCanvas.height = cropH;
  const croppedCtx = croppedCanvas.getContext('2d');

  croppedCtx.drawImage(img, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

  return croppedCanvas;
}

processBtn.addEventListener('click', async () => {
  if (!loadedFiles.length) return alert('Please add images first.');

  processBtn.disabled = true;
  downloadAllBtn.disabled = true;
  processBtn.textContent = 'Trimming Margins…';
  resultsGrid.innerHTML = '';
  processedOutputs = [];

  const tol = Number(toleranceInput.value);

  for (let fIdx = 0; fIdx < loadedFiles.length; fIdx++) {
    const file = loadedFiles[fIdx];
    const img = new Image();
    img.src = URL.createObjectURL(file);
    await img.decode();

    const pCanvas = processImage(img, tol);
    const dataUrl = pCanvas.toDataURL('image/png');
    const fileName = `clean_${file.name.replace(/\.[^/.]+$/, "")}.png`;

    processedOutputs.push({ url: dataUrl, name: fileName });

    const container = document.createElement('div');
    container.className = 'result-item';

    const previewImg = document.createElement('img');
    previewImg.src = dataUrl;

    const info = document.createElement('div');
    info.className = 'result-info';
    info.innerHTML = `<span>${pCanvas.width}x${pCanvas.height}px</span>`;

    const dl = document.createElement('button');
    dl.className = 'dl-btn';
    dl.textContent = 'Save PNG';
    dl.onclick = () => {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = fileName;
      a.click();
    };

    info.appendChild(dl);
    container.appendChild(previewImg);
    container.appendChild(info);
    resultsGrid.appendChild(container);

    URL.revokeObjectURL(img.src);
  }

  processBtn.disabled = false;
  processBtn.textContent = 'Extract Panel Artwork';
  downloadAllBtn.disabled = false;
});

// Bulk download trigger
downloadAllBtn.addEventListener('click', () => {
  processedOutputs.forEach((item, index) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = item.url;
      a.download = item.name;
      a.click();
    }, index * 200);
  });
});
</script>
</body>
</html>
