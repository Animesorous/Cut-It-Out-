/* -----------------------------
   SLIDER VISUALS
----------------------------- */

function updateSlider(el){

    const min = Number(el.min);
    const max = Number(el.max);
    const value = Number(el.value);

    const pct =
        ((value - min) / (max - min)) * 100;

    el.style.setProperty(
        "--fill",
        pct + "%"
    );
}

updateSlider(tolEl);
updateSlider(padEl);


/* -----------------------------
   FILE COUNT
----------------------------- */

function updateCount(){

    count.innerHTML = `
        <span style="color:#38e98b">✓</span>
        <strong>${selected.length}</strong>
        ${selected.length === 1 ? "image" : "images"} selected
    `;
}


/* -----------------------------
   IMAGE IMPORT
----------------------------- */

function setFiles(files){

    const valid = files.filter(
        file =>
            file &&
            file.type &&
            file.type.startsWith("image/")
    );

    selected = valid;

    updateCount();

    previewToken++;

    if(resultPreviewURL){
        URL.revokeObjectURL(resultPreviewURL);
        resultPreviewURL = null;
    }

    cropPreview.src = "";
    cropPreview.style.display = "none";

    const resultEmpty =
        resultFrame.querySelector(".empty-preview");

    if(resultEmpty){
        resultEmpty.style.display = "block";
    }

    if(!selected.length){

        origPreview.src = "";
        origPreview.style.display = "none";

        const originalEmpty =
            originalFrame.querySelector(".empty-preview");

        if(originalEmpty){
            originalEmpty.style.display = "block";
        }

        return;
    }

    showPreview(selected[0]);
}


/* Clicking anywhere in drop zone */

drop.addEventListener("click", event => {

    if(event.target === filesEl){
        return;
    }

    filesEl.click();

});


/* File picker */

filesEl.addEventListener("change", () => {

    setFiles(
        Array.from(filesEl.files || [])
    );

});


/* Drag over */

drop.addEventListener("dragover", event => {

    event.preventDefault();

    event.dataTransfer.dropEffect = "copy";

    drop.classList.add("drag");

});


/* Drag leave */

drop.addEventListener("dragleave", event => {

    if(!drop.contains(event.relatedTarget)){
        drop.classList.remove("drag");
    }

});


/* Drop */

drop.addEventListener("drop", event => {

    event.preventDefault();

    drop.classList.remove("drag");

    setFiles(
        Array.from(
            event.dataTransfer.files || []
        )
    );

});


/* -----------------------------
   PREVIEW
----------------------------- */

async function showPreview(file){

    if(previewURL){
        URL.revokeObjectURL(previewURL);
        previewURL = null;
    }

    previewURL =
        URL.createObjectURL(file);

    origPreview.src = previewURL;

    origPreview.style.display = "block";

    const empty =
        originalFrame.querySelector(".empty-preview");

    if(empty){
        empty.style.display = "none";
    }

    await updatePreview();

}


/* -----------------------------
   IMAGE LOADER
----------------------------- */

function loadImage(file){

    return new Promise((resolve, reject) => {

        const url =
            URL.createObjectURL(file);

        const img =
            new Image();

        img.onload = () => {

            URL.revokeObjectURL(url);

            resolve(img);

        };

        img.onerror = () => {

            URL.revokeObjectURL(url);

            reject(
                new Error(
                    "Could not load image."
                )
            );

        };

        img.src = url;

    });

}


/* -----------------------------
   MODE
----------------------------- */

function setMode(mode){

    cropMode = mode;

    modeNormal.classList.toggle(
        "active",
        mode === "normal"
    );

    modeAggressive.classList.toggle(
        "active",
        mode === "aggressive"
    );

    if(selected.length){
        updatePreview();
    }

}


modeNormal.addEventListener(
    "click",
    () => {

        if(!modeNormal.disabled){
            setMode("normal");
        }

    }
);


modeAggressive.addEventListener(
    "click",
    () => {

        if(!modeAggressive.disabled){
            setMode("aggressive");
        }

    }
);

tolEl.addEventListener(

        tolVal.textContent =

        updateSlider(tolEl);

);


/* -----------------------------
   SAFETY MARGIN
----------------------------- */

padEl.addEventListener(

    () => {

        padVal.textContent =
            padEl.value + " px";

        updateSlider(padEl);

        if(selected.length){
            updatePreview();

    }
);


/* -----------------------------

----------------------------- */

resetBtn.addEventListener(
    "click",

        tolEl.value = "18";

        selfImprove.checked = true;

        tolVal.textContent = "18";
        padVal.textContent = "2 px";

        updateSlider(tolEl);
        updateSlider(padEl);

        setMode("normal");

    }
);


/* -----------------------------
   LOCK CONTROLS
----------------------------- */

function setLocked(value){

    settings.classList.toggle(
        "locked",
        value
    );

    tolEl.disabled = value;
    padEl.disabled = value;

    resetBtn.disabled = value;

    modeNormal.disabled = value;
    modeAggressive.disabled = value;

    selfImprove.disabled = value;

}


/* -----------------------------
   PROGRESS
----------------------------- */

function setProgress(value, text){

    const v =
        Math.max(
            0,
            Math.min(100, value)
        );

    bar.style.width =
        v + "%";

    percent.textContent =
        Math.round(v) + "%";

    if(text){
        progressText.textContent =
            text;
    }

}


/* -----------------------------
   INITIAL STATE
----------------------------- */

updateCount();

updateSlider(tolEl);
updateSlider(padEl);

setMode("normal");

/* =========================================================
   AI BACKGROUND REMOVER
   BRIA RMBG-1.4
========================================================= */

let remover = null;
let modelLoading = null;


/* -----------------------------
   LOAD MODEL
----------------------------- */

async function getRemover(){

    if(remover){
        return remover;
    }

    if(modelLoading){
        return modelLoading;
    }

    modelLoading = (async () => {

        status.textContent =
            "Loading BRIA AI model…";

        progressText.textContent =
            "Downloading AI model…";

        try{

            const mod = await import(
                "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1"
            );

            const pipeline =
                mod.pipeline;

            /*
             * BRIA RMBG-1.4 officially uses
             * the image-segmentation pipeline
             * in Transformers.js.
             */

            remover = await pipeline(
                "image-segmentation",
                "briaai/RMBG-1.4"
            );

            status.textContent =
                "AI model ready.";

            return remover;

        }catch(error){

            console.error(
                "AI MODEL ERROR:",
                error
            );

            throw new Error(
                "The AI model could not load. Make sure the page is running on HTTPS or localhost, then try again."
            );

        }finally{

            modelLoading = null;

        }

    })();

    return modelLoading;

}


/* -----------------------------
   RAW IMAGE -> CANVAS
----------------------------- */

function rawImageToCanvas(raw){

    if(
        !raw ||
        !raw.data ||
        !raw.width ||
        !raw.height
    ){

        throw new Error(
            "Invalid AI mask returned."
        );

    }

    const width =
        Number(raw.width);

    const height =
        Number(raw.height);

    const channels =
        Number(raw.channels || 1);

    const data =
        new Uint8ClampedArray(raw.data);

    const canvas =
        document.createElement("canvas");

    canvas.width = width;
    canvas.height = height;

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    const rgba =
        new Uint8ClampedArray(
            width * height * 4
        );


    /*
     * Single-channel mask.
     */

    if(channels === 1){

        for(
            let p = 0,
                i = 0;

            p < width * height;

            p++,
            i += 4
        ){

            const value =
                data[p];

            rgba[i] = 255;
            rgba[i + 1] = 255;
            rgba[i + 2] = 255;
            rgba[i + 3] = value;

        }

    }

    /*
     * RGBA mask.
     */

    else if(channels === 4){

        for(
            let p = 0,
                i = 0;

            p < width * height;

            p++,
            i += 4
        ){

            const r =
                data[i];

            const g =
                data[i + 1];

            const b =
                data[i + 2];

            const a =
                data[i + 3];

            const value =
                Math.round(
                    (r + g + b) / 3
                );

            rgba[i] = 255;
            rgba[i + 1] = 255;
            rgba[i + 2] = 255;

            /*
             * Some models use alpha,
             * some use RGB grayscale.
             */

            rgba[i + 3] =
                Math.max(
                    value,
                    a
                );

        }

    }

    /*
     * RGB mask.
     */

    else if(channels === 3){

        for(
            let p = 0,
                i = 0;

            p < width * height;

            p++,
            i += 4
        ){

            const value =
                Math.round(
                    (
                        data[p * 3] +
                        data[p * 3 + 1] +
                        data[p * 3 + 2]
                    ) / 3
                );

            rgba[i] = 255;
            rgba[i + 1] = 255;
            rgba[i + 2] = 255;
            rgba[i + 3] = value;

        }

    }

    else{

        throw new Error(
            "Unsupported AI mask format."
        );

    }

    ctx.putImageData(
        new ImageData(
            rgba,
            width,
            height
        ),
        0,
        0
    );

    return canvas;

}


/* -----------------------------
   GET AI MASK
----------------------------- */

async function removeBackground(file){

    const pipe =
        await getRemover();

    const url =
        URL.createObjectURL(file);

    try{

        status.textContent =
            "Running AI segmentation…";

        const output =
            await pipe(url);

        console.log(
            "BRIA OUTPUT:",
            output
        );


        if(!output){
            throw new Error(
                "The AI model returned nothing."
            );
        }


        /*
         * Normal image-segmentation output:
         *
         * [
         *   {
         *      label,
         *      score,
         *      mask: RawImage
         *   }
         * ]
         */

        if(
            Array.isArray(output) &&
            output.length
        ){

            /*
             * Find an item containing a mask.
             */

            const item =
                output.find(
                    entry =>
                        entry &&
                        entry.mask &&
                        entry.mask.data
                );

            if(item){

                return rawImageToCanvas(
                    item.mask
                );

            }


            /*
             * Some models may return
             * RawImage directly.
             */

            const direct =
                output.find(
                    entry =>
                        entry &&
                        entry.data &&
                        entry.width &&
                        entry.height
                );

            if(direct){

                return rawImageToCanvas(
                    direct
                );

            }

        }


        /*
         * Direct RawImage fallback.
         */

        if(
            output.data &&
            output.width &&
            output.height
        ){

            return rawImageToCanvas(
                output
            );

        }


        throw new Error(
            "The AI model returned an unsupported mask format."
        );

    }finally{

        URL.revokeObjectURL(url);

    }

}


/* -----------------------------
   RESIZE MASK
----------------------------- */

function resizeMask(
    mask,
    width,
    height
){

    const canvas =
        document.createElement("canvas");

    canvas.width =
        width;

    canvas.height =
        height;

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    ctx.drawImage(
        mask,
        0,
        0,
        width,
        height
    );

    return canvas;

}

/* =========================================================
   MASK PROCESSING
========================================================= */


/* -----------------------------
   EDGE REFINEMENT
----------------------------- */

function refineAlpha(
    alpha,
    width,
    height,
    aggressive
){

    const result =
        new Uint8ClampedArray(alpha);

    const threshold =
        aggressive ? 24 : 12;


    for(
        let y = 1;
        y < height - 1;
        y++
    ){

        for(
            let x = 1;
            x < width - 1;
            x++
        ){

            const i =
                y * width + x;

            const current =
                alpha[i];


            if(current === 0){
                continue;
            }


            let neighbors = 0;


            if(alpha[i - 1] > 100){
                neighbors++;
            }

            if(alpha[i + 1] > 100){
                neighbors++;
            }

            if(alpha[i - width] > 100){
                neighbors++;
            }

            if(alpha[i + width] > 100){
                neighbors++;
            }


            /*
             * Remove isolated weak pixels.
             */

            if(
                neighbors === 0 &&
                current < 150
            ){

                result[i] = 0;

            }

            /*
             * Strengthen uncertain pixels
             * surrounded by foreground.
             */

            else if(
                neighbors >= 3 &&
                current > 35 &&
                current < 220
            ){

                result[i] =
                    Math.min(
                        255,
                        current + threshold
                    );

            }

        }

    }

    return result;

}


/* -----------------------------
   SAFETY MARGIN
----------------------------- */

function applySafety(
    alpha,
    width,
    height,
    pad
){

    if(pad <= 0){
        return alpha;
    }

    const result =
        new Uint8ClampedArray(alpha);


    for(
        let y = 0;
        y < height;
        y++
    ){

        for(
            let x = 0;
            x < width;
            x++
        ){

            const i =
                y * width + x;


            if(alpha[i] > 0){
                continue;
            }


            let nearby = false;


            for(
                let yy =
                    Math.max(0,y-pad);

                yy <=
                    Math.min(height-1,y+pad)
                    && !nearby;

                yy++
            ){

                for(
                    let xx =
                        Math.max(0,x-pad);

                    xx <=
                        Math.min(width-1,x+pad);

                    xx++
                ){

                    if(
                        alpha[
                            yy * width + xx
                        ] > 180
                    ){

                        nearby = true;

                        break;

                    }

                }

            }


            if(nearby){

                /*
                 * Small semi-transparent
                 * protective edge.
                 */

                result[i] = 12;

            }

        }

    }

    return result;

}


/* -----------------------------
   CREATE TRANSPARENT PNG
----------------------------- */

async function createTransparentPNG(file){

    const img =
        await loadImage(file);

    const width =
        img.naturalWidth;

    const height =
        img.naturalHeight;


    /*
     * Get AI segmentation mask.
     */

    const mask =
        await removeBackground(file);


    /*
     * Resize AI mask back to the
     * ORIGINAL image resolution.
     */

    const fitted =
        resizeMask(
            mask,
            width,
            height
        );


    const maskCtx =
        fitted.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    const maskData =
        maskCtx.getImageData(
            0,
            0,
            width,
            height
        );


    /*
     * IMPORTANT:
     *
     * The mask is stored in the
     * alpha channel by rawImageToCanvas().
     */

    const alpha =
        new Uint8ClampedArray(
            width * height
        );


    for(
        let i = 0,
            p = 0;

        i < maskData.data.length;

        i += 4,
        p++
    ){

        alpha[p] =
            maskData.data[i + 3];

    }


    /*
     * User settings.
     */

    const aggressive =
        cropMode === "aggressive";

    const tolerance =
        Number(tolEl.value);


    /*
     * Higher tolerance =
     * stronger removal.
     */

    const cutoff =
        aggressive
            ? Math.max(
                8,
                60 - tolerance * 0.5
            )
            : Math.max(
                4,
                35 - tolerance * 0.25
            );


    for(
        let i = 0;
        i < alpha.length;
        i++
    ){

        let a =
            alpha[i];


        if(a <= cutoff){

            a = 0;

        }


        /*
         * Slightly strengthen
         * very strong foreground.
         */

        if(
            aggressive &&
            a > 190
        ){

            a =
                Math.min(
                    255,
                    a + 8
                );

        }


        alpha[i] = a;

    }


    /*
     * Optional self improvement.
     */

    if(selfImprove.checked){

        for(
            let pass = 0;
            pass < 1;
            pass++
        ){

            const refined =
                refineAlpha(
                    alpha,
                    width,
                    height,
                    aggressive
                );

            alpha.set(refined);

        }

    }


    /*
     * Safety margin.
     */

    const finalAlpha =
        applySafety(
            alpha,
            width,
            height,
            Number(padEl.value)
        );


    /*
     * Create full-resolution output.
     */

    const canvas =
        document.createElement("canvas");

    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
     * Draw ORIGINAL image.
     */

    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );


    /*
     * Apply AI alpha mask.
     */

    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    for(
        let i = 0,
            p = 0;

        i < imageData.data.length;

        i += 4,
        p++
    ){

        imageData.data[i + 3] =
            finalAlpha[p];

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    /*
     * Export PNG.
     */

    const blob =
        await new Promise(
            (resolve,reject) => {

                canvas.toBlob(
                    result => {

                        if(result){

                            resolve(result);

                        }else{

                            reject(
                                new Error(
                                    "Could not create PNG."
                                )
                            );

                        }

                    },
                    "image/png"
                );

            }
        );


    return {
        blob,
        width,
        height
    };

}

/* =========================================================
   LIVE PREVIEW
========================================================= */

async function updatePreview(){

    if(!selected.length){
        return;
    }


    const token =
        ++previewToken;


    cropPreview.style.display =
        "none";


    try{

        status.textContent =
            "Generating live preview…";


        const result =
            await createTransparentPNG(
                selected[0]
            );


        /*
         * User changed the image/settings
         * while the old preview was processing.
         */

        if(token !== previewToken){
            return;
        }


        if(resultPreviewURL){

            URL.revokeObjectURL(
                resultPreviewURL
            );

        }


        resultPreviewURL =
            URL.createObjectURL(
                result.blob
            );


        cropPreview.src =
            resultPreviewURL;

        cropPreview.style.display =
            "block";


        const empty =
            resultFrame.querySelector(
                ".empty-preview"
            );


        if(empty){

            empty.style.display =
                "none";

        }


        status.textContent =
            "Preview ready.";

    }catch(error){

        console.error(
            "PREVIEW ERROR:",
            error
        );


        if(token === previewToken){

            cropPreview.style.display =
                "none";

            status.textContent =
                error.message ||
                "Preview failed.";

        }

    }

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadBlob(
    blob,
    name
){

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download = name;

    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
        () => {

            URL.revokeObjectURL(url);

        },
        4000
    );

}


/* =========================================================
   FILE NAME
========================================================= */

function outputName(name){

    const dot =
        name.lastIndexOf(".");


    const base =
        dot > 0
            ? name.slice(0,dot)
            : name;


    return base +
        "-no-bg.png";

}


/* =========================================================
   RESULTS
========================================================= */

function renderResults(){

    results.innerHTML = "";


    const totalPages =
        Math.max(
            1,
            Math.ceil(
                outputs.length /
                PAGE_SIZE
            )
        );


    if(currentPage > totalPages){

        currentPage =
            totalPages;

    }


    const start =
        (currentPage - 1) *
        PAGE_SIZE;


    outputs
        .slice(
            start,
            start + PAGE_SIZE
        )
        .forEach(item => {


            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "result";


            const img =
                document.createElement(
                    "img"
                );


            const imageURL =
                URL.createObjectURL(
                    item.blob
                );


            img.src =
                imageURL;

            img.alt =
                item.name;


            img.onload =
                () => {

                    URL.revokeObjectURL(
                        imageURL
                    );

                };


            const done =
                document.createElement(
                    "div"
                );

            done.className =
                "done";

            done.textContent =
                "DONE";


            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "download-one";

            button.textContent =
                "⇩";

            button.title =
                "Download image";


            button.addEventListener(
                "click",
                () => {

                    downloadBlob(
                        item.blob,
                        item.name
                    );

                }
            );


            const body =
                document.createElement(
                    "div"
                );

            body.className =
                "result-body";


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "result-name";

            name.textContent =
                item.name;

            name.title =
                item.name;


            const size =
                document.createElement(
                    "div"
                );

            size.className =
                "result-size";

            size.textContent =
                `${item.width} × ${item.height}`;


            body.append(
                name,
                size
            );


            card.append(
                img,
                done,
                button,
                body
            );


            results.appendChild(
                card
            );

        });


    renderPagination();

}


/* =========================================================
   PAGINATION
========================================================= */

function renderPagination(){

    pagination.innerHTML = "";


    const totalPages =
        Math.max(
            1,
            Math.ceil(
                outputs.length /
                PAGE_SIZE
            )
        );


    if(totalPages <= 1){
        return;
    }


    const prev =
        document.createElement(
            "button"
        );

    prev.type =
        "button";

    prev.className =
        "page-btn";

    prev.textContent =
        "‹";

    prev.disabled =
        currentPage === 1;


    prev.addEventListener(
        "click",
        () => {

            if(currentPage > 1){

                currentPage--;

                renderResults();

            }

        }
    );


    pagination.appendChild(
        prev
    );


    const first =
        Math.max(
            1,
            Math.min(
                currentPage - 3,
                totalPages - 6
            )
        );


    const last =
        Math.min(
            totalPages,
            first + 6
        );


    for(
        let p = first;
        p <= last;
        p++
    ){

        const button =
            document.createElement(
                "button"
            );

        button.type =
            "button";

        button.className =
            "page-btn" +
            (
                p === currentPage
                    ? " active"
                    : ""
            );

        button.textContent =
            p;


        button.addEventListener(
            "click",
            () => {

                currentPage =
                    p;

                renderResults();

            }
        );


        pagination.appendChild(
            button
        );

    }


    const next =
        document.createElement(
            "button"
        );

    next.type =
        "button";

    next.className =
        "page-btn";

    next.textContent =
        "›";

    next.disabled =
        currentPage === totalPages;


    next.addEventListener(
        "click",
        () => {

            if(
                currentPage <
                totalPages
            ){

                currentPage++;

                renderResults();

            }

        }
    );


    pagination.appendChild(
        next
    );


    const info =
        document.createElement(
            "span"
        );

    info.className =
        "page-info";

    info.textContent =
        `Page ${currentPage} of ${totalPages} • ${outputs.length} images`;


    pagination.appendChild(
        info
    );

}

/* =========================================================
   CRC32
========================================================= */

function crc32(data){

    let table =
        crc32.table;


    if(!table){

        table =
            new Uint32Array(256);


        for(
            let n = 0;
            n < 256;
            n++
        ){

            let c = n;


            for(
                let k = 0;
                k < 8;
                k++
            ){

                c =
                    (c & 1)
                        ? (
                            0xedb88320 ^
                            (c >>> 1)
                        )
                        : (
                            c >>> 1
                        );

            }


            table[n] =
                c >>> 0;

        }


        crc32.table =
            table;

    }


    let c =
        0xffffffff;


    for(
        let i = 0;
        i < data.length;
        i++
    ){

        c =
            table[
                (c ^ data[i]) & 255
            ] ^
            (c >>> 8);

    }


    return (
        c ^
        0xffffffff
    ) >>> 0;

}


/* =========================================================
   ZIP HELPERS
========================================================= */

function u16(a,n){

    a.push(
        n & 255,
        (n >>> 8) & 255
    );

}


function u32(a,n){

    a.push(
        n & 255,
        (n >>> 8) & 255,
        (n >>> 16) & 255,
        (n >>> 24) & 255
    );

}


function bytes(text){

    return new TextEncoder()
        .encode(text);

}


/* =========================================================
   CREATE ZIP
========================================================= */

async function makeZip(items){

    const chunks = [];
    const central = [];

    let offset = 0;


    for(
        const item of items
    ){

        const data =
            new Uint8Array(
                await item.blob.arrayBuffer()
            );


        const name =
            bytes(item.name);


        const crc =
            crc32(data);


        /*
         * Local file header.
         */

        const local = [];


        u32(
            local,
            0x04034b50
        );

        u16(local,20);
        u16(local,0);
        u16(local,0);
        u16(local,0);
        u16(local,0);

        u32(
            local,
            crc
        );

        u32(
            local,
            data.length
        );

        u32(
            local,
            data.length
        );

        u16(
            local,
            name.length
        );

        u16(
            local,
            0
        );


        chunks.push(
            new Uint8Array(local),
            name,
            data
        );


        /*
         * Central directory entry.
         */

        const cen = [];


        u32(
            cen,
            0x02014b50
        );

        u16(cen,20);
        u16(cen,20);
        u16(cen,0);
        u16(cen,0);
        u16(cen,0);
        u16(cen,0);

        u32(
            cen,
            crc
        );

        u32(
            cen,
            data.length
        );

        u32(
            cen,
            data.length
        );

        u16(
            cen,
            name.length
        );

        u16(cen,0);
        u16(cen,0);
        u16(cen,0);
        u16(cen,0);

        u32(cen,0);

        u32(
            cen,
            offset
        );


        central.push(
            new Uint8Array(cen),
            name
        );


        offset +=
            local.length +
            name.length +
            data.length;

    }


    const centralOffset =
        offset;


    let centralSize = 0;


    for(
        const item of central
    ){

        chunks.push(item);

        centralSize +=
            item.length;

    }


    /*
     * End of central directory.
     */

    const end = [];


    u32(
        end,
        0x06054b50
    );

    u16(end,0);
    u16(end,0);

    u16(
        end,
        items.length
    );

    u16(
        end,
        items.length
    );

    u32(
        end,
        centralSize
    );

    u32(
        end,
        centralOffset
    );

    u16(end,0);


    chunks.push(
        new Uint8Array(end)
    );


    return new Blob(
        chunks,
        {
            type:
                "application/zip"
        }
    );

}
